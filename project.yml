name: Shoo
options:
  bundleIdPrefix: com.lukadadiani
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shoo:
    type: application
    platform: iOS
    sources: [Shoo]
    info:
      path: Shoo/Info.plist
      properties:
        CFBundleDisplayName: SHOO
        NSCameraUsageDescription: SHOO watches for pests on-device. Video never leaves this phone.
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.shoo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5QC5886P5V
